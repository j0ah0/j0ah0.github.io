---
layout: null
permalink: /i-am/
---
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>I am - {{ site.title }}</title>
<link rel="icon" type="image/png" href="{{ "/assets/favicon.png" | relative_url }}">
<link rel="apple-touch-icon" href="{{ "/assets/favicon.png" | relative_url }}">
<style>
  :root {
    --ink: #111;
    --bg: #fdfdfc;
    --muted: #b7b7b3;
    --accent: #F15A5A;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    overflow: hidden; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .stage {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    touch-action: none;
  }
  .hint {
    position: absolute; top: 28px; left: 28px; font-size: 13px; color: var(--muted);
  }
  .circle {
    position: absolute; top: 50%; left: 12%; width: 16px; height: 16px;
    background: var(--accent); border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 8px rgba(241, 90, 90, 0.12);
    z-index: 5; transition: transform .35s ease, top .35s ease; cursor: pointer;
  }
  .wheel-stage {
    position: absolute; inset: 0; perspective: 1000px;
  }
  .wheel {
    position: absolute; left: 26%; top: 50%; width: 66%; height: 0;
    transform-style: preserve-3d;
  }
  .row {
    position: absolute; left: 0; top: 0; width: 100%;
    transform-origin: center center;
    will-change: transform, opacity;
    cursor: pointer; user-select: none;
  }
  .row .idx {
    display: block; font-size: 13px; letter-spacing: 0.08em; color: var(--muted);
    margin-bottom: 6px; font-weight: 500;
  }
  .row .label {
    font-size: clamp(34px, 6vw, 58px); font-weight: 700; letter-spacing: -0.03em; line-height: 1;
    color: var(--ink); transition: color .25s ease;
  }
  .row.is-active .label { color: var(--accent); }

  .detail {
    position: absolute; left: 26%; top: 50%; width: 62%; max-width: 560px;
    transform: translateY(-50%);
    opacity: 0; pointer-events: none;
    z-index: 6;
    max-height: 78vh; overflow-y: auto;
  }
  .detail.is-open { opacity: 1; pointer-events: auto; }
  .detail .idx {
    display: block; font-size: 13px; letter-spacing: 0.08em; color: var(--muted);
    margin-bottom: 10px; font-weight: 500;
  }
  .detail h2 {
    font-size: clamp(28px, 5vw, 40px); font-weight: 700; letter-spacing: -0.03em; margin: 0 0 22px;
    color: var(--accent);
  }
  .detail p {
    font-size: 16px; line-height: 1.85; color: var(--ink); margin: 0 0 16px;
    max-width: 46ch;
    opacity: 0; transform: translateY(14px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .detail.is-open p { opacity: 1; transform: translateY(0); }

  @media (max-width: 640px) {
    .circle { left: 10%; width: 12px; height: 12px; }
    .wheel { left: 26%; width: 70%; }
    .detail { left: 26%; width: 68%; }
    .detail p { max-width: 32ch; }
  }

  /* ---- 코너 고정 브랜드/네비게이션 (모든 페이지 공통, 레이아웃과 무관하게 항상 표시) ---- */
  .corner-brand { position: fixed; bottom: 24px; left: 28px; font-size: 14px; letter-spacing: 0.02em;
    color: #141414; z-index: 1000; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .corner-nav { position: fixed; bottom: 24px; right: 28px; z-index: 1000;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .corner-nav a { color: #141414; text-decoration: none; font-size: 14px; margin-left: 18px; }
  .corner-nav a:first-child { margin-left: 0; }
  .corner-nav a:hover { color: #8a8a86; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="hint" id="hint">scroll, or click a word</div>
  <div class="circle" id="circle"></div>
  <div class="wheel-stage">
    <div class="wheel" id="wheel"></div>
  </div>
  <div class="detail" id="detail">
    <span class="idx" id="detailIdx"></span>
    <h2 id="detailTitle"></h2>
    <div id="detailBody"></div>
  </div>
</div>

{% include corner-nav.html %}
{% include custom-cursor.html %}

<script>
const ITEMS = [
  {
    key: 'name', idx: '01', label: 'Name',
    paras: ['조하영', '대한민국', 'ig: j0ah0']
  },
  {
    key: 'like', idx: '02', label: 'Like',
    paras: [
      '좋아하는 것: 음악 듣기, 아이스 디저트, 역사와 배경',
      '커피를 마시거나 술을 마시고 훌륭한 음악을 들으면 충분하다.'
    ]
  },
  {
    key: 'hate', idx: '03', label: 'Hate',
    paras: [
      '싫어하는 것: 올리브, 욕, 피상적인 것',
      '블랙 올리브. 피자 위에 올라가는 그 검은 링이다. 원래 초록색이던 걸 화학 처리로 검게 만든 것이다. 색을 고정하려고 철분 시약을 넣는다. 그래서인지 입에 넣으면 피 비린내 같은 금속 냄새가 난다. 거기에 떫고 쓴맛도 남는다. 지방 성분이 입안을 오래 코팅하면서 그 향을 계속 붙잡아둔다. 화학 실험을 자주 하다 보니 뇌가 방향족 화합물 냄새와 이 맛을 비슷하게 묶어버린 모양이다. 위험한 것으로 분류해놓고 계속 뱉어내려 하는 것이다. 이유가 많아 보이는데... 그냥 몸이 정직하게 반응하는 편이다. 비슷한 이유로 녹차, 떫은 와인, 카카오 함량이 높은 다크 초콜릿 등도 한동안 못 먹었다.',
      '겉으로만 친한 척하는 것, 내용 없는 대화, 유행이라서 좋아하는 척하는 것... 이런 것들 앞에서 마음이 금방 식는다. 말과 행동이 다른 사람도 그렇다. 한다고 해놓고 안 하고, 좋다고 해놓고 반대로 행동하는 것. 한두 번이면 넘어갈 수 있다. 그런데 패턴이 되면 신뢰가 빠르게 사라진다. 욕도 비슷하다. 꼭 필요해서 쓰는 말이라기보다 순간의 감정을 대충 덮어버리는 말처럼 느껴질 때가 많다. 정확한 단어를 고르는 편이 더 낫다.'
    ]
  },
  {
    key: 'why', idx: '04', label: 'Why',
    paras: [
      '누군가에게 영감이 되고 싶었다. 이 사이트를 보고 위로를 받거나, 어떤 긍정적인 부분을 하나라도 가져간다면 좋겠다고 생각했다. 세상에 좋은 영향을 남기고 싶다는 생각도 문득 들었다. 그래서 만들었다. 기억해 달라는 말을 직접 하기보다는 사이트 하나 남겨두는 편이 조금 덜 민망한 것 같다.'
    ]
  }
];

const wheel = document.getElementById('wheel');
const detail = document.getElementById('detail');
const detailIdx = document.getElementById('detailIdx');
const detailTitle = document.getElementById('detailTitle');
const detailBody = document.getElementById('detailBody');
const circle = document.getElementById('circle');
const stage = document.getElementById('stage');
const hint = document.getElementById('hint');

const rows = ITEMS.map((item, i) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.i = i;
  row.innerHTML = `<span class="idx">${item.idx}</span><span class="label">${item.label}</span>`;
  wheel.appendChild(row);
  return row;
});

const ANGLE_STEP = 34;   // deg between items
const RADIUS = 240;      // px

let offset = 0;          // continuous, in item units
let openIndex = null;

function render() {
  rows.forEach((row, i) => {
    const rel = i - offset;
    const angle = rel * ANGLE_STEP;
    const a = Math.abs(angle);
    let opacity = Math.max(1 - a / 100, 0);
    row.style.transform = `translateY(-50%) rotateX(${angle}deg) translateZ(${RADIUS}px)`;
    row.style.opacity = openIndex === null ? opacity : 0;
    row.style.pointerEvents = openIndex === null ? 'auto' : 'none';
    row.classList.toggle('is-active', Math.round(offset) === i && a < ANGLE_STEP / 2);
  });
}
render();

function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

function onWheelEvent(e) {
  if (openIndex !== null) {
    if (e.deltaY !== 0) closeDetail();
    return;
  }
  e.preventDefault();
  offset = clamp(offset + e.deltaY * 0.0045, 0, ITEMS.length - 1);
  render();
}
stage.addEventListener('wheel', onWheelEvent, { passive: false });

// Touch drag support (mobile / trackpad-less touch devices).
let touchStartY = null;
let touchStartOffset = 0;
stage.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
  touchStartOffset = offset;
}, { passive: true });
stage.addEventListener('touchmove', (e) => {
  if (touchStartY === null) return;
  if (openIndex !== null) {
    if (Math.abs(e.touches[0].clientY - touchStartY) > 24) closeDetail();
    return;
  }
  const dy = e.touches[0].clientY - touchStartY;
  offset = clamp(touchStartOffset - dy * 0.012, 0, ITEMS.length - 1);
  render();
}, { passive: true });
stage.addEventListener('touchend', () => { touchStartY = null; });

// Keyboard support.
document.addEventListener('keydown', (e) => {
  if (openIndex !== null) {
    if (e.key === 'Escape' || e.key === 'ArrowUp' || e.key === 'ArrowDown') closeDetail();
    return;
  }
  if (e.key === 'ArrowDown') { offset = clamp(offset + 1, 0, ITEMS.length - 1); render(); }
  if (e.key === 'ArrowUp') { offset = clamp(offset - 1, 0, ITEMS.length - 1); render(); }
  if (e.key === 'Enter') openItem(Math.round(offset));
});

rows.forEach((row, i) => {
  row.addEventListener('click', () => openItem(i));
});

function openItem(i) {
  offset = i;
  openIndex = i;
  render();
  const item = ITEMS[i];
  detailIdx.textContent = item.idx;
  detailTitle.textContent = item.label;
  detailBody.innerHTML = item.paras.map(p => `<p>${p}</p>`).join('');
  requestAnimationFrame(() => {
    detail.classList.add('is-open');
    const rect = detailTitle.getBoundingClientRect();
    circle.style.top = (rect.top + rect.height / 2) + 'px';
  });
  circle.style.transform = 'translate(-50%, -50%) scale(1.6)';
  hint.textContent = 'click the circle, or scroll, to go back';
}

function closeDetail() {
  detail.classList.remove('is-open');
  openIndex = null;
  circle.style.top = '50%';
  circle.style.transform = 'translate(-50%, -50%) scale(1)';
  hint.textContent = 'scroll, or click a word';
  render();
}

circle.addEventListener('click', () => { if (openIndex !== null) closeDetail(); });
</script>
</body>
</html>
