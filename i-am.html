---
layout: null
permalink: /i-am/
---
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>I am - {{ site.title }}</title>
<link rel="icon" type="image/png" href="{{ "/assets/favicon.png" | relative_url }}">
<link rel="apple-touch-icon" href="{{ "/assets/favicon.png" | relative_url }}">
<style>
  /* Same font the /log/ page's 3D carousel renders its text in
     (see log-app-src/src/App.jsx FONT_URL), loaded here so /i-am/
     uses identical typography instead of the system font stack. */
  @font-face {
    font-family: 'Inter';
    src: url('https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.woff') format('woff');
    font-weight: 400; font-display: swap;
  }
  @font-face {
    font-family: 'Inter';
    src: url('https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-500-normal.woff') format('woff');
    font-weight: 500; font-display: swap;
  }
  @font-face {
    font-family: 'Inter';
    src: url('https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.woff') format('woff');
    font-weight: 700; font-display: swap;
  }

  :root {
    --ink: #111;
    --bg: #ffffff;
    --num: #2a2a26;
    --font: 'Inter', -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--ink);
    font-family: var(--font);
  }
  body { overflow-x: hidden; }

  .archive {
    position: relative;
    width: 100%;
    min-height: 100vh;
    /* 바닥 여백은 fade보다 이 값이 진짜 방어선이다 (fade는 pointer-events:none
       이라 클릭을 막지 못함) — 그리드 마지막 줄이 코너 네비 히트박스 근처에도
       물리적으로 닿지 않도록 넉넉한 고정값 + 노치 안전영역까지 확보한다. */
    padding: 96px 48px calc(160px + env(safe-area-inset-bottom, 0px));
    transition: opacity .25s ease;
  }
  .archive.is-focused { opacity: 0; pointer-events: none; }

  .profile {
    max-width: 1120px;
    margin: 0 auto 64px;
  }
  .profile p {
    font-size: 13px;
    line-height: 1.7;
    color: var(--ink);
    margin: 0 0 16px;
  }

  .archive-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 72px 40px;
    max-width: 1120px;
    margin: 0 auto;
  }

  .archive-item {
    position: relative;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(12px);
    animation: item-in .7s cubic-bezier(.22,.61,.36,1) forwards;
    animation-delay: calc(var(--i, 0) * 110ms);
  }
  @keyframes item-in {
    to { opacity: 1; transform: translateY(0); }
  }

  .archive-num {
    display: block;
    font-family: var(--font);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--num);
    margin: 0 0 8px 1px;
  }

  .archive-photo-btn {
    display: inline-block; width: auto; max-width: 100%; padding: 0; border: none; background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    margin-top: auto; /* bottom-align photos of differing heights within a row */
  }
  .archive-photo {
    /* Match every item's HEIGHT (not width) so the row reads evenly, while
       each photo still keeps its own aspect ratio rather than being cropped. */
    height: 170px; width: auto; max-width: 100%; object-fit: contain; display: block;
    background: transparent;
    transition: transform .6s cubic-bezier(.22,.61,.36,1);
    will-change: transform;
  }
  .archive-photo-btn:hover .archive-photo,
  .archive-photo-btn:focus-visible .archive-photo {
    transform: scale(1.025);
  }

  /* clicked item lifts out of flow into a fixed "ghost" overlay; the grid
     item underneath just goes invisible so siblings never reflow */
  .archive-item.is-source { opacity: 0 !important; animation: none; }

  .archive-ghost {
    position: fixed; z-index: 40; top: 0; left: 0;
    will-change: transform;
    pointer-events: none;
  }
  .archive-ghost .archive-photo {
    /* The grid gives every photo a fixed height; the ghost overrides that
       back to aspect-ratio-driven sizing so the FLIP width animation (see
       openItem/closeDetail) isn't fighting a fixed height. */
    height: auto; width: 100%; max-width: none;
    transition: none; cursor: pointer; pointer-events: auto;
  }
  .archive-ghost .archive-num { position: absolute; top: -22px; left: 1px; margin: 0; }

  .archive-detail {
    position: fixed; z-index: 30; inset: 0;
    display: flex; align-items: center; justify-content: flex-start;
    padding: 0 8vw;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .archive-detail.is-visible { opacity: 1; pointer-events: auto; }
  .archive-detail-close {
    /* A tap here always works even when a scroll gesture ate the click
       elsewhere (mobile suppresses `click` when the touch moved at all,
       which happens easily once the detail view scrolls). */
    position: fixed; top: 20px; left: 20px; z-index: 50;
    width: 40px; height: 40px; border: none; background: none;
    font-size: 28px; line-height: 1; color: var(--ink); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0; pointer-events: none;
    -webkit-tap-highlight-color: transparent;
  }
  .archive-detail.is-visible .archive-detail-close { pointer-events: auto; }
  .archive-detail-spacer { flex: 0 0 clamp(180px, 24vw, 280px); }
  .archive-detail-text {
    max-width: 46ch;
    margin-left: clamp(32px, 6vw, 72px);
  }
  .archive-detail-text h2 {
    font-size: 16px;
    font-weight: 400;
    line-height: 1.85;
    color: var(--ink);
    margin: 0 0 16px;
    opacity: 0; transform: translateY(10px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .archive-detail-text p {
    font-size: 16px; line-height: 1.85; color: var(--ink); margin: 0 0 16px;
    opacity: 0; transform: translateY(10px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .archive-detail.is-visible .archive-detail-text h2,
  .archive-detail.is-visible .archive-detail-text p {
    opacity: 1; transform: translateY(0);
  }
  .archive-detail-text p:nth-of-type(2) { transition-delay: .08s; }
  .archive-detail-text p:nth-of-type(3) { transition-delay: .16s; }

  @media (max-width: 860px) {
    .archive { padding: 88px 24px calc(160px + env(safe-area-inset-bottom, 0px)); }
    .archive-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px 24px; }
  }
  @media (max-width: 560px) {
    /* Shrink everything so a detail fits in one screen without scrolling
       where possible, rather than just reducing the scroll distance. */
    .archive-detail { flex-direction: column; align-items: flex-start; justify-content: flex-start;
      padding: 52px 20px 64px; overflow-y: auto; }
    /* flex-basis (the "0 0 <n>" part) sets the flex item's size along the
       main axis, which flex-direction: column just switched to vertical —
       so it now sizes height, not width. Width needs its own value or the
       spacer (and the ghost photo sized from it) collapses to 0 wide. */
    .archive-detail-spacer { flex: 0 0 min(34vw, 150px); width: min(34vw, 150px); }
    .archive-detail-text { margin-left: 0; margin-top: 14px; max-width: 100%; }
    .archive-detail-text h2 { font-size: 14px; margin-bottom: 10px; }
    .archive-detail-text p { font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
  }

  /* ---- 코너 고정 브랜드/네비게이션 (모든 페이지 공통) ---- */
  .corner-brand { position: fixed; bottom: 24px; left: 28px; font-size: 14px; letter-spacing: 0.02em;
    color: #141414; z-index: 1000; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .corner-nav { position: fixed; bottom: 24px; right: 28px; z-index: 1000;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  /* 히트박스만 키우는 트릭: padding으로 클릭 가능 영역을 늘리고 그만큼
     음수 margin으로 상쇄해서 눈에 보이는 위치/간격은 그대로 유지한다.
     "네비 누르려다 살짝 빗나가서" 바로 아래 그리드 사진이 눌리는 걸 막는
     실질적 방어선 (fade는 시각효과일 뿐 클릭을 막지 못함). */
  .corner-nav a {
    display: inline-block;
    color: #141414; text-decoration: none; font-size: 14px;
    padding: 14px 8px;
    margin: -14px -8px -14px 10px;
  }
  .corner-nav a:first-child { margin-left: -8px; }
  .corner-nav a:hover { color: #8a8a86; }

  /* 하단 네비게이션으로 내려가는 콘텐츠(그리드 이미지, 상세 텍스트)를
     자연스럽게 페이드아웃 — 네비(z-index:1000)보다 한 단계 낮게 두어
     네비 글자는 항상 선명하게, 그 아래로 내려오는 콘텐츠만 흐려짐. */
  body::after {
    content: "";
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 150px;
    z-index: 999;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent 0%, var(--bg) 100%);
  }
</style>
</head>
<body>

<div class="archive">
  <div class="profile">
    <p>조하영<br>대한민국</p>
    <p>좋아하는 것: 음악 듣기, 아이스 디저트, 역사와 배경<br>싫어하는 것: 올리브, 욕, 피상적인 것</p>
    <p>2023 자연계열 졸업<br>현재 공대생 4학년</p>
    <p>ig: j0ah0</p>
  </div>
  <div class="archive-grid" id="archiveGrid"></div>
</div>

<div class="archive-detail" id="archiveDetail">
  <button type="button" class="archive-detail-close" id="detailClose" aria-label="닫기">×</button>
  <div class="archive-detail-spacer"></div>
  <div class="archive-detail-text">
    <h2 id="detailTitle"></h2>
    <div id="detailBody"></div>
  </div>
</div>

{% include corner-nav.html %}

<script>
// Each item is one small personal essay, represented by a photo.
const ITEMS = [
  {
    idx: '01',
    img: '{{ "/assets/archive-01-site.png" | relative_url }}',
    alt: '맥북',
    title: '이 사이트를 만든 이유',
    paras: [
      '누군가에게 영감이 되고 싶었다. 이 사이트를 보고 위로를 받거나, 어떤 긍정적인 부분을 하나라도 가져간다면 좋겠다고 생각했다. 세상에 좋은 영향을 남기고 싶다는 생각도 문득 들었다. 그래서 만들었다. 기억해 달라는 말을 직접 하기보다는 사이트 하나 남겨두는 편이 조금 덜 민망한 것 같다.'
    ]
  },
  {
    idx: '02',
    img: '{{ "/assets/archive-02-coffee.png" | relative_url }}',
    alt: '커피',
    scale: 0.72,
    title: '행복 공식',
    paras: [
      '커피를 마시거나 술을 마시고 훌륭한 음악을 들으면 충분하다.'
    ]
  },
  {
    idx: '03',
    img: '{{ "/assets/archive-03-olive.png" | relative_url }}',
    alt: '올리브',
    title: '올리브를 싫어하는 이유',
    paras: [
      '블랙 올리브. 피자 위에 올라가는 그 검은 링이다. 원래 초록색이던 걸 화학 처리로 검게 만든 것이다. 색을 고정하려고 철분 시약을 넣는다. 그래서인지 입에 넣으면 피 비린내 같은 금속 냄새가 난다. 거기에 떫고 쓴맛도 남는다. 지방 성분이 입안을 오래 코팅하면서 그 향을 계속 붙잡아둔다.',
      '화학 실험을 자주 하다 보니 뇌가 방향족 화합물 냄새와 이 맛을 비슷하게 묶어버린 모양이다. 위험한 것으로 분류해놓고 계속 뱉어내려 하는 것이다. 이유가 많아 보이는데... 그냥 몸이 정직하게 반응하는 편이다. 비슷한 이유로 녹차, 떫은 와인, 카카오 함량이 높은 다크 초콜릿 등도 한동안 못 먹었다.'
    ]
  },
  {
    idx: '04',
    img: '{{ "/assets/archive-04-superficial.png" | relative_url }}',
    alt: '피상적 뜻',
    title: '피상적 뜻',
    paras: [
      '겉으로만 친한 척하는 것, 내용 없는 대화, 유행이라서 좋아하는 척하는 것... 이런 것들 앞에서 마음이 금방 식는다. 말과 행동이 다른 사람도 그렇다. 한다고 해놓고 안 하고, 좋다고 해놓고 반대로 행동하는 것. 한두 번이면 넘어갈 수 있다. 그런데 패턴이 되면 신뢰가 빠르게 사라진다.',
      '욕도 비슷하다. 꼭 필요해서 쓰는 말이라기보다 순간의 감정을 대충 덮어버리는 말처럼 느껴질 때가 많다. 정확한 단어를 고르는 편이 더 낫다.'
    ]
  }
];

const archiveEl = document.querySelector('.archive');
const grid = document.getElementById('archiveGrid');
const detail = document.getElementById('archiveDetail');
const detailClose = document.getElementById('detailClose');
const detailTitle = document.getElementById('detailTitle');
const detailBody = document.getElementById('detailBody');

let openState = null; // { item, sourceEl, ghostEl }

const BASE_PHOTO_HEIGHT = 170; // px, matches .archive-photo's default height

ITEMS.forEach((item, i) => {
  const el = document.createElement('div');
  el.className = 'archive-item';
  el.style.setProperty('--i', i);
  el.innerHTML = `
    <span class="archive-num">${item.idx}</span>
    <button type="button" class="archive-photo-btn" aria-label="${item.title}">
      <img class="archive-photo" src="${item.img}" alt="${item.alt}" />
    </button>
  `;
  if (item.scale) {
    el.querySelector('.archive-photo').style.height = (BASE_PHOTO_HEIGHT * item.scale) + 'px';
  }
  el.querySelector('.archive-photo-btn').addEventListener('click', (e) => {
    e.stopPropagation(); // don't let this same click reach the document-level closer below
    openItem(item, el);
  });
  grid.appendChild(el);
});

function openItem(item, sourceEl) {
  if (openState) return;
  const photo = sourceEl.querySelector('.archive-photo');
  const first = photo.getBoundingClientRect();

  sourceEl.classList.add('is-source');
  archiveEl.classList.add('is-focused');

  // Build a fixed-position ghost that starts exactly where the real photo was.
  const ghost = document.createElement('div');
  ghost.className = 'archive-ghost';
  ghost.innerHTML = `
    <span class="archive-num">${item.idx}</span>
    <img class="archive-photo" src="${item.img}" alt="${item.alt}" style="aspect-ratio:${first.width}/${first.height};" />
  `;
  document.body.appendChild(ghost);

  ghost.style.width = first.width + 'px';
  ghost.style.transform = `translate(${first.left}px, ${first.top}px)`;

  requestAnimationFrame(() => {
    // Target: .archive-detail-spacer's column, vertically centered on the
    // photo's own (post-scale) height — the spacer itself is zero-height,
    // so its rect.top is already the vertical center point, not a top edge.
    const spacer = detail.querySelector('.archive-detail-spacer');
    detail.classList.add('is-visible');
    const target = spacer.getBoundingClientRect();
    const maxTargetHeight = window.innerHeight * 0.78;
    let targetWidth = target.width;
    let targetHeight = targetWidth * (first.height / first.width);
    if (targetHeight > maxTargetHeight) {
      targetHeight = maxTargetHeight;
      targetWidth = targetHeight * (first.width / first.height);
    }
    const targetTop = target.top - targetHeight / 2;
    ghost.style.transition = 'transform .55s cubic-bezier(.22,.61,.36,1), width .55s cubic-bezier(.22,.61,.36,1)';
    ghost.style.width = targetWidth + 'px';
    ghost.style.transform = `translate(${target.left}px, ${targetTop}px)`;
  });

  detailTitle.textContent = item.title;
  detailBody.innerHTML = item.paras.map(p => `<p>${p}</p>`).join('');

  openState = { item, sourceEl, ghost };
}

function closeDetail() {
  if (!openState) return;
  const { sourceEl, ghost } = openState;
  const first = sourceEl.querySelector('.archive-photo').getBoundingClientRect();

  detail.classList.remove('is-visible');
  archiveEl.classList.remove('is-focused');
  ghost.style.transform = `translate(${first.left}px, ${first.top}px)`;
  ghost.style.width = first.width + 'px';

  const cleanup = () => {
    sourceEl.classList.remove('is-source');
    ghost.remove();
    openState = null;
  };
  ghost.addEventListener('transitionend', cleanup, { once: true });
  setTimeout(cleanup, 650); // safety net if transitionend doesn't fire
}

// Clicking anywhere while a detail is open goes back — including on the
// ghost photo (which lives outside #archiveDetail, appended to <body>),
// its number label, or empty space. Only the corner nav links are exempt
// so they still navigate normally instead of just closing the detail.
document.addEventListener('click', (e) => {
  if (!openState) return;
  if (e.target.closest('.corner-nav, .corner-brand')) return;
  closeDetail();
});

// A dedicated close button as a fallback: mobile browsers suppress the
// `click` event whenever a touch moved even a little (easy to trigger once
// the detail view is scrollable), so tapping "anywhere" can silently fail.
detailClose.addEventListener('click', (e) => {
  e.stopPropagation();
  closeDetail();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeDetail();
});
</script>
</body>
</html>
