---
layout: default
---
<style>
  /* 우측 상단 Back / Next — 하단 corner-nav와 같은 활자·간격.
     Back = 날짜상 더 이전 글(page.previous), Next = 더 이후 글(page.next). */
  .post-nav { position: fixed; top: 24px; right: 28px; z-index: 900;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 14px; }
  .post-nav a, .post-nav span { margin-left: 18px; text-decoration: none; }
  .post-nav a:first-child, .post-nav span:first-child { margin-left: 0; }
  .post-nav a { color: #141414; }
  .post-nav a:hover { color: #8a8a86; }
  .post-nav span { color: #c8c8c4; }

  /* 편집물(editorial)형 본문: 좌우 30px, 13px 활자, 큰 제목 없음.
     이 스타일은 post 레이아웃에만 적용되고 다른 페이지에는 영향이 없다. */
  .wrap { padding-left: 30px; padding-right: 30px; }
  main.wrap { padding-top: 200px; }
  /* 데스크톱의 넓은 창에서는 .wrap이 중앙 정렬(margin:0 auto)돼 콘텐츠가
     화면 가운데로 떠 보인다. 왼쪽으로 당겨서 좌측 30px 기준선에 더 가깝게 —
     순수 중앙(calc(50vw - 360px))보다 120px 더 왼쪽. 700px 근방 좁은 창에서는
     30px 아래로 내려가지 않는다(콘텐츠가 화면 밖으로 밀리지 않도록). */
  @media (min-width: 701px) {
    .wrap { margin-left: max(30px, calc(50vw - 480px)); margin-right: auto; }
  }
  /* Back/Next 네비(top:24px, 14px 텍스트, 하단 약 46px)와 날짜 줄 사이 간격을
     모바일에서 조금 더 내려서 104px로 — 데스크톱 200px는 더 넓은 간격이라
     그대로 둔다. */
  @media (max-width: 700px) {
    main.wrap { padding-top: 150px; }
  }
  .post-article { font-size: 13px; line-height: 1.55; }
  .post-article h1 { font-size: 13px; font-weight: 400; letter-spacing: 0; line-height: 1.55; margin: 0 0 36px; }
  /* 월/일 editorial navigation: 두 칸 그리드라 일(day)은 콘텐츠 폭의 정중앙에서 시작 */
  .post-dateline { display: grid; grid-template-columns: 1fr 1fr; align-items: baseline;
    font-size: 14px; font-weight: 400; line-height: 1.55;
    text-transform: lowercase; margin: 0 0 100px; }
  .post-dateline .m-short { display: none; }
  @media (max-width: 380px) {
    .post-dateline .m-full { display: none; }
    .post-dateline .m-short { display: inline; }
  }
  .post-article img { max-width: 100%; height: auto; }
</style>
<nav class="post-nav">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">Back</a>{% else %}<span>Back</span>{% endif %}
  {% if page.next %}<a href="{{ page.next.url | relative_url }}">Next</a>{% else %}<span>Next</span>{% endif %}
</nav>
<article class="post-article">
  <div class="post-dateline">
    <span><span class="m-full">{{ page.date | date: "%B" }}</span><span class="m-short">{{ page.date | date: "%b" }}</span></span>
    <span>{{ page.date | date: "%-d" }}</span>
  </div>
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
