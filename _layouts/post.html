---
layout: default
---
<style>
  /* 우측 상단 Back / Next — 하단 corner-nav와 같은 활자·간격.
     Jekyll의 page.next = 더 오래된 글, page.previous = 더 새 글. */
  .post-nav { position: fixed; top: 24px; right: 28px; z-index: 900;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 14px; }
  .post-nav a, .post-nav span { margin-left: 18px; text-decoration: none; }
  .post-nav a:first-child, .post-nav span:first-child { margin-left: 0; }
  .post-nav a { color: #141414; }
  .post-nav a:hover { color: #8a8a86; }
  .post-nav span { color: #c8c8c4; }

  /* 편집물(editorial)형 본문: 좌우 30px, 12px 활자, 큰 제목 없음.
     이 스타일은 post 레이아웃에만 적용되고 다른 페이지에는 영향이 없다. */
  .wrap { padding-left: 30px; padding-right: 30px; }
  main.wrap { padding-top: 72px; }
  .post-article { font-size: 12px; line-height: 1.55; }
  .post-article h1 { font-size: 12px; font-weight: 400; letter-spacing: 0; line-height: 1.55; margin: 0; }
  .post-article .post-date { font-size: 12px; line-height: 1.55; margin: 0 0 36px; }
  .post-article img { max-width: 100%; height: auto; }
</style>
<nav class="post-nav">
  {% if page.next %}<a href="{{ page.next.url | relative_url }}">Back</a>{% else %}<span>Back</span>{% endif %}
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">Next</a>{% else %}<span>Next</span>{% endif %}
</nav>
<article class="post-article">
  <h1>{{ page.title }}</h1>
  <p class="post-date">{{ page.date | date: "%Y-%m-%d" }}</p>
  {{ content }}
</article>
