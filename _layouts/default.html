<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ site.title }}</title>
<link rel="icon" type="image/png" href="{{ "/assets/favicon.png" | relative_url }}">
<link rel="apple-touch-icon" href="{{ "/assets/favicon.png" | relative_url }}">
<style>
  :root {
    --text: #111;
    --bg: #fdfdfd;
    --muted: #828282;
    --border: #e8e8e8;
    --accent: #2a7ae2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  main { padding: 40px 0 100px; min-height: 60vh; }
  h1 { font-size: 26px; letter-spacing: -0.3px; }
  .post-date { color: var(--muted); font-size: 13px; }
  .post-list { list-style: none; padding: 0; margin: 0; }
  .post-list li { padding: 18px 0; border-bottom: 1px solid var(--border); }
  .post-list li:first-child { padding-top: 0; }
  .post-list .post-date { margin-right: 10px; }
  .post-link { font-size: 17px; color: var(--accent); text-decoration: none; }
  .post-link:hover { text-decoration: underline; }

  /* ---- 코너 고정 브랜드/네비게이션 (모든 페이지 공통) ---- */
  .corner-brand { position: fixed; bottom: 24px; left: 28px; font-size: 14px; letter-spacing: 0.02em;
    color: #141414; z-index: 1000; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .corner-nav { position: fixed; bottom: 24px; right: 28px; z-index: 1000;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .corner-nav a { color: #141414; text-decoration: none; font-size: 14px; margin-left: 18px; }
  .corner-nav a:first-child { margin-left: 0; }
  .corner-nav a:hover { color: #8a8a86; }

  /* 모바일에서는 배경이 없는 텍스트라 스크롤되는 본문 글자가 네비 글자와 그대로
     겹쳐 보인다 (데스크톱은 페이지가 짧아 잘 스크롤 안 해서 덜 두드러졌었다).
     화면 아래쪽에 옅은 그라데이션을 깔아서, 지나가는 글이 네비 근처에서
     자연스럽게 옅어지며 사라지게 한다 (네비 자체는 그대로 둔다). */
  @media (max-width: 700px) {
    body::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 72px;
      background: linear-gradient(to bottom, rgba(253,253,253,0) 0%, var(--bg) 60%);
      pointer-events: none;
      z-index: 999;
    }
  }
</style>
</head>
<body>
  <main class="wrap">
    {{ content }}
  </main>

  {% include corner-nav.html %}
</body>
</html>
