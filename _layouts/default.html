<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }}</title>
<link rel="icon" type="image/png" href="{{ "/assets/favicon.png" | relative_url }}">
<link rel="apple-touch-icon" href="{{ "/assets/favicon.png" | relative_url }}">
<style>
  :root {
    --text: #111;
    --bg: #fdfdfd;
    --muted: #828282;
    --border: #e8e8e8;
    --accent: #2a7ae2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  .site-header { border-bottom: 1px solid var(--border); padding: 20px 0; }
  .site-header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .site-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    letter-spacing: -0.3px;
  }
  nav a {
    color: var(--text);
    text-decoration: none;
    margin-left: 18px;
    font-size: 15px;
  }
  nav a:first-child { margin-left: 0; }
  nav a:hover { color: var(--accent); }
  main { padding: 40px 0; min-height: 60vh; }
  h1 { font-size: 26px; letter-spacing: -0.3px; }
  .post-date { color: var(--muted); font-size: 13px; }
  .post-list { list-style: none; padding: 0; margin: 0; }
  .post-list li { padding: 18px 0; border-bottom: 1px solid var(--border); }
  .post-list li:first-child { padding-top: 0; }
  .post-list .post-date { margin-right: 10px; }
  .post-link { font-size: 17px; color: var(--accent); text-decoration: none; }
  .post-link:hover { text-decoration: underline; }
  footer {
    border-top: 1px solid var(--border);
    padding: 24px 0;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }

  /* ---- 커스텀 커서 ---- */
  html.has-custom-cursor,
  html.has-custom-cursor * {
    cursor: none !important;
  }
  .js-cursor-outer {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%, -50%);
    will-change: transform;
  }
  .js-cursor-dot {
    position: relative;
    width: 8px;
    height: 8px;
    background: #000;
    border-radius: 50%;
    transition:
      width 0.15s ease,
      height 0.15s ease,
      border-width 0.15s ease,
      border-radius 0.15s ease,
      background-color 0.15s ease,
      opacity 0.15s ease;
  }
  .js-cursor-outer.is-pointer .js-cursor-dot {
    width: 16px;
    height: 16px;
  }
  .js-cursor-outer.is-text .js-cursor-dot {
    width: 2px;
    height: 20px;
    border-radius: 1px;
  }
  .js-cursor-outer.is-wait .js-cursor-dot {
    width: 16px;
    height: 16px;
    background: transparent;
    border: 2px solid #000;
    border-radius: 50%;
    animation: cursor-spin 0.7s linear infinite;
  }
  @keyframes cursor-spin {
    to { transform: rotate(360deg); }
  }
  .js-cursor-outer.is-crosshair .js-cursor-dot {
    width: 0;
    height: 0;
    background: transparent;
  }
  .js-cursor-outer.is-crosshair .js-cursor-dot::before,
  .js-cursor-outer.is-crosshair .js-cursor-dot::after {
    content: "";
    position: absolute;
    background: #000;
  }
  .js-cursor-outer.is-crosshair .js-cursor-dot::before {
    width: 16px;
    height: 2px;
    top: -1px;
    left: -8px;
  }
  .js-cursor-outer.is-crosshair .js-cursor-dot::after {
    width: 2px;
    height: 16px;
    top: -8px;
    left: -1px;
  }
</style>
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header-inner">
      <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ "/" | relative_url }}">Main</a>
        <a href="{{ "/i-am/" | relative_url }}">I am</a>
        <a href="{{ "/log/" | relative_url }}">Log</a>
        <a href="{{ "/board/" | relative_url }}">Board</a>
        <a href="mailto:{{ site.email }}">Mail to</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer>
    <div class="wrap">&copy; 2026 {{ site.title }}</div>
  </footer>

  <div class="js-cursor-outer" aria-hidden="true">
    <div class="js-cursor-dot"></div>
  </div>
  <script>
    (function () {
      if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

      var outer = document.querySelector(".js-cursor-outer");
      if (!outer) return;

      document.documentElement.classList.add("has-custom-cursor");

      window.addEventListener("mousemove", function (e) {
        outer.style.transform = "translate(" + e.clientX + "px, " + e.clientY + "px) translate(-50%, -50%)";
      });

      var POINTER_SELECTOR = 'a, button, [role="button"], input[type="submit"], input[type="button"], summary, .cursor-pointer';
      var TEXT_SELECTOR = 'input:not([type="submit"]):not([type="button"]):not([type="checkbox"]):not([type="radio"]), textarea, [contenteditable="true"]';
      var CROSSHAIR_SELECTOR = '[data-cursor="crosshair"]';

      function setState(state) {
        outer.classList.remove("is-pointer", "is-text", "is-wait", "is-crosshair");
        if (state) outer.classList.add(state);
      }

      document.addEventListener("mouseover", function (e) {
        var target = e.target;
        if (target.closest && target.closest(CROSSHAIR_SELECTOR)) setState("is-crosshair");
        else if (target.closest && target.closest(TEXT_SELECTOR)) setState("is-text");
        else if (target.closest && target.closest(POINTER_SELECTOR)) setState("is-pointer");
      });

      document.addEventListener("mouseout", function (e) {
        var related = e.relatedTarget;
        var stillInside = related && related.closest && (
          related.closest(CROSSHAIR_SELECTOR) ||
          related.closest(TEXT_SELECTOR) ||
          related.closest(POINTER_SELECTOR)
        );
        if (!stillInside) setState(null);
      });

      window.setCursorWaiting = function (isWaiting) {
        outer.classList.toggle("is-wait", !!isWaiting);
      };
    })();
  </script>
</body>
</html>
