---
layout: null
permalink: /log/
---
<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log - {{ site.title }}</title>
  <style>
    :root{ --bg:#fdfdfc; --ink:#141414; --muted:#8a8a86; }
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
      font-family:-apple-system,"Pretendard","Helvetica Neue",Arial,sans-serif; overflow:hidden; }
    .stage{ position:relative; width:100%; height:100vh; }
    canvas{ display:block; cursor:grab; }
    canvas:active{ cursor:grabbing; }
    .back-link{ position:absolute; top:24px; left:28px; font-size:20px; color:var(--ink); text-decoration:none; z-index:2; }
    .back-link:hover{ color:var(--muted); }
    .hint{ position:absolute; top:28px; left:64px; font-size:13px; letter-spacing:.02em; color:var(--muted); z-index:2; }
    .fallback{ position:absolute; inset:0; display:none; align-items:center; justify-content:center;
      padding:0 40px; text-align:center; color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <a class="back-link" href="{{ "/" | relative_url }}">&larr;</a>
    <div class="hint">scroll up/down, or drag ...</div>
    <div class="fallback" id="fallback">이 브라우저에서는 WebGL을 사용할 수 없어요.<br />크롬 설정에서 하드웨어 가속을 켜보세요.</div>
  </div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script>
    const items = [
      {% if site.posts.size > 0 %}
        {% for post in site.posts %}
        {
          slug: {{ post.slug | jsonify }},
          thumbnail: {% if post.thumbnail %}{{ post.thumbnail | relative_url | jsonify }}{% else %}{{ "https://picsum.photos/seed/" | append: post.slug | append: "/240/160" | jsonify }}{% endif %},
          season: {{ post.season | default: "" | jsonify }},
          href: {{ post.url | relative_url | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      {% else %}
        {% for i in (0..23) %}
        {
          slug: "dummy-{{ i }}",
          thumbnail: "https://picsum.photos/seed/log{{ i }}/240/160",
          season: {% if i < 12 %}"spring"{% else %}"autumn"{% endif %},
          href: "#"
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      {% endif %}
    ];

    const stage = document.getElementById('stage');
    const fallback = document.getElementById('fallback');

    if (!window.WebGLRenderingContext) {
      fallback.style.display = 'flex';
    } else {
      try {
        initScene();
      } catch (err) {
        console.error(err);
        fallback.style.display = 'flex';
      }
    }

    function makeLabelTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 640; canvas.height = 320;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#141414';
      ctx.font = 'italic 700 120px -apple-system, "Helvetica Neue", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      return tex;
    }

    // crop a texture to CSS background-size:cover behavior for a given plane aspect
    function coverTexture(tex, planeAspect) {
      const imgAspect = tex.image.width / tex.image.height;
      if (imgAspect > planeAspect) {
        const scale = planeAspect / imgAspect;
        tex.repeat.set(scale, 1);
        tex.offset.set((1 - scale) / 2, 0);
      } else {
        const scale = imgAspect / planeAspect;
        tex.repeat.set(1, scale);
        tex.offset.set(0, (1 - scale) / 2);
      }
      tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    }

    function initScene() {
      // thin standing "domino" cards, arranged in a ring split into two
      // arcs by season — a text panel marks where each arc begins, so
      // rotating the ring surfaces "spring"/"autumn" as you pass into it
      const cardW = 0.5, cardH = 1.65;
      const labelW = 2.4, labelH = 1.2;

      const springItems = items.filter((it) => it.season !== 'autumn');
      const autumnItems = items.filter((it) => it.season === 'autumn');
      const cards = [...springItems, ...autumnItems];

      const N = cards.length;
      const step = N > 0 ? (2 * Math.PI) / N : 0;
      // dominoes packed tight on their own ring; season labels are placed
      // separately at the seam angles, a bit further out, so a wide label
      // doesn't force the whole ring to space out to fit it
      const radius = N > 1 ? (cardW / 2) / Math.tan(Math.PI / N) + 0.4 : 0;
      const labelRadius = radius + 1.1;

      // seam before springItems[0] (i.e. just after the last autumn card)
      // and seam before autumnItems[0] (just after the last spring card)
      const labels = [];
      if (springItems.length) labels.push({ text: 'spring', angle: -step / 2 });
      if (autumnItems.length) labels.push({ text: 'autumn', angle: (springItems.length - 0.5) * step });

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, radius * 5 + 50);
      camera.position.set(0, 1.3, radius * 1.35 + 3);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      if (!renderer.getContext()) throw new Error('no webgl context');
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      stage.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 1.0));

      const ring = new THREE.Group();
      scene.add(ring);

      const loader = new THREE.TextureLoader();
      loader.crossOrigin = 'anonymous';

      const meshes = [];
      cards.forEach((item, i) => {
        const angle = i * step;
        const geo = new THREE.PlaneGeometry(cardW, cardH);
        const mat = new THREE.MeshBasicMaterial({ color: 0xdddddd, side: THREE.FrontSide, transparent: true });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.userData = item;
        mesh.position.set(Math.sin(angle) * radius, 0, Math.cos(angle) * radius);
        mesh.rotation.y = angle;
        ring.add(mesh);
        meshes.push(mesh);

        loader.load(item.thumbnail, (tex) => {
          coverTexture(tex, cardW / cardH);
          mat.map = tex;
          mat.color.set(0xffffff);
          mat.needsUpdate = true;
        });
      });

      labels.forEach((label) => {
        const geo = new THREE.PlaneGeometry(labelW, labelH);
        const mat = new THREE.MeshBasicMaterial({ map: makeLabelTexture(label.text), transparent: true, side: THREE.FrontSide });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(Math.sin(label.angle) * labelRadius, 0, Math.cos(label.angle) * labelRadius);
        mesh.rotation.y = label.angle;
        ring.add(mesh);
      });

      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', onResize);

      let rotation = 0, velocity = 0;
      const damping = 0.92;

      function tick() {
        if (Math.abs(velocity) > 0.0001) {
          rotation += velocity;
          velocity *= damping;
          ring.rotation.y = rotation;
        }
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();

      stage.addEventListener('wheel', (e) => { e.preventDefault(); velocity += e.deltaY * 0.0006; }, { passive: false });

      let dragging = false, lastX = 0, dragMoved = false;
      stage.addEventListener('pointerdown', (e) => { dragging = true; dragMoved = false; lastX = e.clientX; });
      window.addEventListener('pointerup', () => dragging = false);
      window.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - lastX; lastX = e.clientX;
        if (Math.abs(dx) > 1) dragMoved = true;
        velocity += dx * 0.004;
      });

      stage.addEventListener('click', (e) => {
        if (dragMoved) return;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(
          (e.clientX / window.innerWidth) * 2 - 1,
          -(e.clientY / window.innerHeight) * 2 + 1
        );
        raycaster.setFromCamera(mouse, camera);
        const hit = raycaster.intersectObjects(meshes)[0];
        if (hit && hit.object.userData.href && hit.object.userData.href !== '#') {
          window.location.href = hit.object.userData.href;
        }
      });
    }
  </script>
</body>
</html>
