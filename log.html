---
layout: null
permalink: /log/
---
<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log - {{ site.title }}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fdfdfc; }
    .scroll-hint { position: absolute; top: 24px; left: 28px; font-size: 14px;
      color: #141414; z-index: 2; pointer-events: none;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .corner-brand { position: fixed; bottom: 26px; left: 28px; font-size: 14px; letter-spacing: 0.02em;
      color: #141414; z-index: 1000; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .corner-nav { position: fixed; top: 24px; right: 28px; z-index: 1000;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .corner-nav a { color: #141414; text-decoration: none; font-size: 14px; margin-left: 18px; }
    .corner-nav a:first-child { margin-left: 0; }
    .corner-nav a:hover { color: #8a8a86; }
    .fallback { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      padding: 0 40px; text-align: center; color: #8a8a86; font-size: 14px;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body>
  <div class="scroll-hint">scroll up/down ...</div>
  {% include corner-nav.html %}
  {% include custom-cursor.html %}
  <div class="fallback" id="fallback">이 브라우저에서는 WebGL을 사용할 수 없어요.<br />크롬 설정에서 하드웨어 가속을 켜보세요.</div>
  <div id="root" style="height:100vh;"></div>

  <script>
    window.__LOG_ITEMS__ = [
      {% if site.posts.size > 0 %}
        {% for post in site.posts %}
        {% assign post_month = post.date | date: "%-m" | plus: 0 %}
        {% capture post_season %}{% if post.season %}{{ post.season }}{% elsif post_month >= 3 and post_month <= 5 %}spring{% elsif post_month >= 6 and post_month <= 8 %}summer{% elsif post_month >= 9 and post_month <= 11 %}autumn{% else %}winter{% endif %}{% endcapture %}
        {
          slug: {{ post.slug | jsonify }},
          title: {{ post.title | default: post.slug | jsonify }},
          date: {{ post.date | date: "%Y-%m-%d" | jsonify }},
          thumbnail: {% if post.thumbnail %}{{ post.thumbnail | relative_url | jsonify }}{% else %}{{ "https://picsum.photos/seed/" | append: post.slug | append: "/320/198" | jsonify }}{% endif %},
          season: {{ post_season | strip | jsonify }},
          href: {{ post.url | relative_url | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      {% else %}
        {% for i in (0..23) %}
        {
          slug: "dummy-{{ i }}",
          title: "더미 글 {{ i }}",
          date: "",
          thumbnail: "https://picsum.photos/seed/log{{ i }}/320/198",
          season: {% if i < 6 %}"spring"{% elsif i < 12 %}"summer"{% elsif i < 18 %}"autumn"{% else %}"winter"{% endif %},
          href: "#"
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      {% endif %}
    ];

    if (!window.WebGLRenderingContext) {
      document.getElementById('fallback').style.display = 'flex';
    }
  </script>
  <script type="module" src="{{ "/assets/log-app.js" | relative_url }}"></script>
</body>
</html>
